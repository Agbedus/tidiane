<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — Tidiane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#071422;font-family:'Inter',system-ui,sans-serif;overflow:hidden}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(184,151,90,.06) 0%,transparent 60%);pointer-events:none}
  .login-card{width:100%;max-width:400px;padding:52px 40px;background:#0D1F35;border:1px solid rgba(184,151,90,.18);border-radius:8px;text-align:center;position:relative;z-index:1;box-shadow:0 24px 80px rgba(0,0,0,.4)}
  .login-brand{font-family:'Playfair Display',Georgia,serif;font-size:1.1rem;color:#F5F0E8;margin-bottom:4px;letter-spacing:.02em}
  .login-sub{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#B8975A;margin-bottom:32px}
  .login-card label{display:block;text-align:left;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:#8899AA;margin-bottom:6px;margin-top:20px}
  .login-card input{width:100%;padding:11px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(184,151,90,.18);border-radius:4px;color:#F5F0E8;font-size:.88rem;font-family:inherit;outline:none;transition:border-color .3s}
  .login-card input:focus{border-color:#B8975A}
  .login-card input::placeholder{color:rgba(136,153,170,.5)}
  .login-btn{width:100%;margin-top:28px;padding:12px;background:transparent;border:1px solid rgba(184,151,90,.35);color:#B8975A;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:4px;transition:background .3s,color .3s;font-family:inherit;font-weight:500}
  .login-btn:hover{background:rgba(184,151,90,.12);border-color:#B8975A}
  .error{color:#e06060;font-size:.78rem;margin-top:16px;padding:8px 12px;background:rgba(224,96,96,.08);border:1px solid rgba(224,96,96,.15);border-radius:4px}
  .back-link{display:inline-block;margin-top:24px;font-size:.72rem;color:#8899AA;text-decoration:none;transition:color .25s}
  .back-link:hover{color:#B8975A}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-brand">Tidiane</div>
  <div class="login-sub">Admin Panel</div>
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" autofocus required autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" required autocomplete="current-password">
    <button type="submit" class="login-btn">Sign In</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
  <a href="/" class="back-link">&larr; Back to site</a>
</div>
</body>
</html>
